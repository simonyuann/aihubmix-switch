name: Hybrid desktop release build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
permissions:
  contents: read
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, macOS, ARM64, aihubmix-release]
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: [self-hosted, macOS, ARM64, aihubmix-release]
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    env:
      GEMINI_OAUTH_CLIENT_ID: ${{ secrets.GEMINI_OAUTH_CLIENT_ID }}
      GEMINI_OAUTH_CLIENT_SECRET: ${{ secrets.GEMINI_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev libxdo-dev patchelf file
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Clear previously patched Windows executable
        if: runner.os == 'Windows'
        run: cargo clean --manifest-path src-tauri/Cargo.toml --package cc-switch --release --target ${{ matrix.target }}
      - name: Build native desktop executable
        # OAuth client values are injected only into release builds, keeping
        # Gemini's upstream subscription refresh behavior available.
        run: pnpm tauri build --target ${{ matrix.target }} --no-bundle -- --locked
        env:
          CI: 'true'
      - name: Preserve the unbundled portable executable
        if: runner.os == 'Windows'
        run: node scripts/collect-portable.mjs ${{ matrix.target }}
      - name: Bundle signed desktop updates
        if: runner.os != 'macOS'
        run: pnpm tauri bundle --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
        env:
          CI: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Bundle macOS desktop updates
        if: runner.os == 'macOS'
        run: pnpm tauri bundle --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci --no-sign
        env:
          CI: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify native updater installation formats
        run: node scripts/check-update-format.mjs ${{ matrix.target }}
      - name: Test native configuration, detection and model verification
        if: runner.os != 'Windows'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
      - name: Test Windows with Common Controls v6
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows.ps1 -Target ${{ matrix.target }}
      - run: node scripts/collect-artifacts.mjs ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

