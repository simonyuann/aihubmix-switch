name: Add verified Linux packages to v1.1.2
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Linux rebuild run ID
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Linux build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_run }}
        shell: bash
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq 'select(.conclusion == "success" and .event == "workflow_dispatch" and .path == ".github/workflows/rebuild-desktop-release.yml" and .head_branch == "feat/linux-v1.1.2") | .id' | grep -Fx "$RUN_ID"
          gh run download "$RUN_ID" --name desktop-x86_64-unknown-linux-gnu --dir linux
      - name: Verify existing and Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir artifacts
          gh release download v1.1.2 --dir artifacts
          (cd artifacts && sha256sum -c SHA256SUMS.txt)
          test "$(find linux -maxdepth 1 -type f | wc -l)" -eq 4
          cp linux/* artifacts/
          node scripts/prepare-linux-v112.mjs artifacts
          (cd artifacts && sha256sum -c SHA256SUMS.txt)
      - name: Add Linux assets and update checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.1.2 artifacts/*linux* --clobber
          gh release upload v1.1.2 artifacts/latest-v2.json artifacts/SHA256SUMS.txt --clobber
          gh release view v1.1.2 --json assets --jq '.assets[] | select(.name | contains("linux")) | [.name,.digest] | @tsv'
