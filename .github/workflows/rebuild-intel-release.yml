name: Rebuild Intel release artifact

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        default: v1.1.0

permissions:
  contents: read

jobs:
  bundle:
    runs-on: macos-latest
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      GEMINI_OAUTH_CLIENT_ID: ${{ secrets.GEMINI_OAUTH_CLIENT_ID }}
      GEMINI_OAUTH_CLIENT_SECRET: ${{ secrets.GEMINI_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify immutable release source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node -e 'const fs=require("node:fs"); const v=JSON.parse(fs.readFileSync("package.json")).version; if(process.env.RELEASE_TAG!==`v${v}` || !/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG)) process.exit(1)'
          git rev-parse HEAD
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-apple-darwin
      - run: rustup target list --installed
      - run: pnpm install --frozen-lockfile
      - name: Build native desktop executable
        run: pnpm tauri build --target x86_64-apple-darwin --no-bundle -- --locked
        env:
          CI: 'true'
      - name: Bundle signed desktop updates
        run: pnpm tauri bundle --target x86_64-apple-darwin --bundles app,dmg --ci
        env:
          CI: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify native updater installation formats
        run: node scripts/check-update-format.mjs x86_64-apple-darwin
      - name: Test native configuration, detection and model verification
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --locked --target x86_64-apple-darwin
      - run: node scripts/collect-artifacts.mjs x86_64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-x86_64-apple-darwin
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
