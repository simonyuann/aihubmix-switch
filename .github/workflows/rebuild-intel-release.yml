name: Rebuild Intel release artifact

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        default: v1.1.0

permissions:
  contents: read

jobs:
  bundle:
    runs-on: macos-latest
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      GEMINI_OAUTH_CLIENT_ID: ${{ secrets.GEMINI_OAUTH_CLIENT_ID }}
      GEMINI_OAUTH_CLIENT_SECRET: ${{ secrets.GEMINI_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify immutable release source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node -e 'const fs=require("node:fs"); const v=JSON.parse(fs.readFileSync("package.json")).version; if(process.env.RELEASE_TAG!==`v${v}` || !/^vd+.d+.d+$/.test(process.env.RELEASE_TAG)) process.exit(1)'
          git rev-parse HEAD
      - uses: ./.github/actions/bundle-desktop
        with:
          target: x86_64-apple-darwin
          bundles: app,dmg
          native_tests: 'true'
          tauri_signing_private_key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          tauri_signing_private_key_password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
