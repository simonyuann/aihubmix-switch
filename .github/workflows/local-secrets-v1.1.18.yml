name: Local release configuration v1.1.18

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: [self-hosted, aihub-v118-config]
    env:
      GEMINI_OAUTH_CLIENT_ID: ${{ secrets.GEMINI_OAUTH_CLIENT_ID }}
      GEMINI_OAUTH_CLIENT_SECRET: ${{ secrets.GEMINI_OAUTH_CLIENT_SECRET }}
    steps:
      - name: Pass release configuration to local builder
        run: |
          node -e 'const fs=require("fs");const keys=["GEMINI_OAUTH_CLIENT_ID","GEMINI_OAUTH_CLIENT_SECRET"];for(const key of keys)if(!process.env[key])throw Error("Missing release configuration");fs.writeFileSync("/home/smy/build-aihub/v1.1.18/gemini-oauth.json",JSON.stringify(Object.fromEntries(keys.map(key=>[key,process.env[key]]))),{mode:0o600});console.log("Local release configuration ready")'
