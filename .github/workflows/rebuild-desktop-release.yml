name: Rebuild desktop release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to build in parallel
        required: true
        default: v1.1.1
      native_tests:
        description: Run native regressions (disable only when the same product source is already verified)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      GEMINI_OAUTH_CLIENT_ID: ${{ secrets.GEMINI_OAUTH_CLIENT_ID }}
      GEMINI_OAUTH_CLIENT_SECRET: ${{ secrets.GEMINI_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify immutable release source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node -e 'const fs=require("node:fs"); const v=JSON.parse(fs.readFileSync("package.json")).version; if(process.env.RELEASE_TAG!==`v${v}` || !/^vd+.d+.d+$/.test(process.env.RELEASE_TAG)) process.exit(1)'
          git rev-parse HEAD
      - name: Require Gemini subscription compatibility configuration
        run: node -e 'for (const k of ["GEMINI_OAUTH_CLIENT_ID", "GEMINI_OAUTH_CLIENT_SECRET"]) if (!process.env[k]) throw new Error(`Missing release configuration ${k}`)'
      - uses: ./.github/actions/bundle-desktop
        with:
          target: ${{ matrix.target }}
          bundles: ${{ matrix.bundles }}
          native_tests: ${{ inputs.native_tests }}
          tauri_signing_private_key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          tauri_signing_private_key_password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

