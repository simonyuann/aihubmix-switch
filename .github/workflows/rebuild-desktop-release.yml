name: Rebuild desktop release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to build in parallel
        required: true
        default: v1.1.1
      native_tests:
        description: Run native regressions (disable only when the same product source is already verified)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_PROFILE_RELEASE_LTO: 'false'
      GEMINI_OAUTH_CLIENT_ID: ${{ secrets.GEMINI_OAUTH_CLIENT_ID }}
      GEMINI_OAUTH_CLIENT_SECRET: ${{ secrets.GEMINI_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify immutable release source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node -e 'const fs=require("node:fs"); const v=JSON.parse(fs.readFileSync("package.json")).version; if(process.env.RELEASE_TAG!==`v${v}` || !/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG)) process.exit(1)'
          git rev-parse HEAD
      - name: Require Gemini subscription compatibility configuration
        run: node -e 'for (const k of ["GEMINI_OAUTH_CLIENT_ID", "GEMINI_OAUTH_CLIENT_SECRET"]) if (!process.env[k]) throw new Error(`Missing release configuration ${k}`)'
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev libxdo-dev patchelf file
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Clear previously patched Windows executable
        if: runner.os == 'Windows'
        run: cargo clean --manifest-path src-tauri/Cargo.toml --package cc-switch --release --target ${{ matrix.target }}
      - name: Build native desktop executable
        run: pnpm tauri build --target ${{ matrix.target }} --no-bundle -- --locked
        env:
          CI: 'true'
      - name: Preserve the unbundled portable executable
        if: runner.os == 'Windows'
        run: node scripts/collect-portable.mjs ${{ matrix.target }}
      - name: Bundle signed desktop updates
        run: pnpm tauri bundle --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
        env:
          CI: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify native updater installation formats
        run: node scripts/check-update-format.mjs ${{ matrix.target }}
      - name: Test native configuration, detection and model verification
        if: inputs.native_tests && runner.os != 'Windows'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
      - name: Test Windows with Common Controls v6
        if: inputs.native_tests && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows.ps1 -Target ${{ matrix.target }}
      - run: node scripts/collect-artifacts.mjs ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

