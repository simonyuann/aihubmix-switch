name: Build and release

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s deploy/download-station -p 'test_*.py'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: node --test tests/update-manifest.test.mjs
      - run: pnpm build:renderer
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Verify release versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"); const v=JSON.parse(fs.readFileSync("package.json")).version; const t=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json")).version; if(process.env.GITHUB_REF_NAME!==`v${v}` || v!==t || !fs.readFileSync("src-tauri/Cargo.toml","utf8").includes(`version = "${v}"`)) process.exit(1)'

  bundle:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      GEMINI_OAUTH_CLIENT_ID: ${{ secrets.GEMINI_OAUTH_CLIENT_ID }}
      GEMINI_OAUTH_CLIENT_SECRET: ${{ secrets.GEMINI_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev libxdo-dev patchelf file
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Clear previously patched Windows executable
        if: runner.os == 'Windows'
        run: cargo clean --manifest-path src-tauri/Cargo.toml --package cc-switch --release --target ${{ matrix.target }}
      - name: Build native desktop executable
        # OAuth client values are injected only into release builds, keeping
        # Gemini's upstream subscription refresh behavior available.
        run: pnpm tauri build --target ${{ matrix.target }} --no-bundle -- --locked
        env:
          CI: 'true'
      - name: Preserve the unbundled portable executable
        if: runner.os == 'Windows'
        run: node scripts/collect-portable.mjs ${{ matrix.target }}
      - name: Bundle signed desktop updates
        run: pnpm tauri bundle --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
        env:
          CI: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify native updater installation formats
        run: node scripts/check-update-format.mjs ${{ matrix.target }}
      - name: Test native configuration, detection and model verification
        if: runner.os != 'Windows'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
      - name: Test Windows with Common Controls v6
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows.ps1 -Target ${{ matrix.target }}
      - run: node scripts/collect-artifacts.mjs ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate updater manifest and checksums
        run: node scripts/generate-update-manifest.mjs artifacts
      - name: Upload complete release as draft
        id: upload_draft
        uses: softprops/action-gh-release@v2
        with:
          name: AIHubMix Switch ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: artifacts/*
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: false

      # The operator promotes the same verified files to dl.csmy.fun before publishing this draft.
      - name: Verify uploaded assets and retain draft for download-station promotion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.upload_draft.outputs.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release-info.json
          node scripts/verify-release-assets.mjs artifacts release-info.json
