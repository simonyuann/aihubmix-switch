name: Build and release

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m unittest discover -s deploy/download-station -p 'test_*.py'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:i18n
      - run: pnpm test:unit
      - run: node --experimental-vm-modules --test tests/*.test.mjs tests/node/*.test.mjs
      - run: pnpm build:renderer
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Verify release versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"); const v=JSON.parse(fs.readFileSync("package.json")).version; const t=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json")).version; if(process.env.GITHUB_REF_NAME!==`v${v}` || v!==t || !fs.readFileSync("src-tauri/Cargo.toml","utf8").includes(`version = "${v}"`)) process.exit(1)'

  bundle:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    env:
      GEMINI_OAUTH_CLIENT_ID: ${{ secrets.GEMINI_OAUTH_CLIENT_ID }}
      GEMINI_OAUTH_CLIENT_SECRET: ${{ secrets.GEMINI_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bundle-desktop
        with:
          target: ${{ matrix.target }}
          bundles: ${{ matrix.bundles }}
          native_tests: 'true'
          tauri_signing_private_key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          tauri_signing_private_key_password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate updater manifest and checksums
        run: node scripts/generate-update-manifest.mjs artifacts
      - name: Upload complete release as draft
        id: upload_draft
        uses: softprops/action-gh-release@v2
        with:
          name: AIHubMix Switch ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: artifacts/*
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: false

      # Publish this draft after verification; the download station syncs it automatically.
      - name: Verify uploaded assets before publishing the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.upload_draft.outputs.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release-info.json
          node scripts/verify-release-assets.mjs artifacts release-info.json
